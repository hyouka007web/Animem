{% extends "admin/_layout.html" %}
{% block title %}{{ heading }} · Admin · {{ site_name }}{% endblock %}
{% block admin %}
<div class="row between mb-lg"><h1>{{ heading }}</h1><a class="muted small" href="/admin/movies">← Zur Liste</a></div>
<script type="application/json" id="editor-data">{{ data|tojson }}</script>
<form data-movie-editor class="stack-lg" novalidate>
  <section class="panel stack">
    <div><label class="f" for="m-title">Titel *</label><input class="input" id="m-title" data-f="title" maxlength="200" required></div>
    <div><label class="f" for="m-desc">Beschreibung</label><textarea class="input" id="m-desc" data-f="description" maxlength="5000"></textarea></div>
    <div data-upload-field="thumb"><label class="f">Poster * (HTTPS-URL oder Upload)</label><input class="input" data-url data-f="thumbnailUrl"><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-file class="small" style="margin-top:6px"></div>
    <div data-upload-field="banner"><label class="f">Banner (optional)</label><input class="input" data-url data-f="bannerUrl"><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-file class="small" style="margin-top:6px"></div>
    <div class="grid-cards c3" style="grid-template-columns:1fr">
      <div><label class="f" for="m-status">Status</label><select class="input" id="m-status" data-f="status"><option value="DRAFT">Entwurf</option><option value="PUBLISHED">Veröffentlicht</option></select></div>
      <div><label class="f" for="m-genres">Genres (kommagetrennt)</label><input class="input" id="m-genres" data-f="genres"></div>
      <div><label class="f" for="m-tags">Tags (kommagetrennt)</label><input class="input" id="m-tags" data-f="tags"></div>
    </div>
  </section>
  <section class="panel">
    <div class="row between mb"><h2>Streams *</h2><button type="button" class="btn btn-ghost btn-sm" data-add-stream>+ Stream</button></div>
    <div data-streams></div>
  </section>
  <div class="sticky-save row"><button class="btn" type="submit">Speichern</button><span class="msg" data-msg></span></div>
</form>
{% endblock %}
