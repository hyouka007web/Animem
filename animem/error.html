{% extends "base.html" %}
{% block title %}Fehler {{ status }} · {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap-sm page center" style="padding-top:80px">
  <p style="font-size:3rem;font-weight:700;color:var(--accent)">{{ status }}</p>
  <p class="muted-2 mb-lg">{{ message }}</p>
  <a class="btn" href="/">Zur Startseite</a>
</div>
{% endblock %}
